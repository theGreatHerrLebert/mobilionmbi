[package]
name = "mobilionmbi"
version = "0.1.0"
edition = "2021"
authors = ["David Teschner <davidteschner@googlemail.com>"]
description = "Pure-Rust reader for MOBILion .mbi ion mobility - mass spectrometry files — no vendor SDK"
license = "MIT OR Apache-2.0"
repository = "https://github.com/theGreatHerrLebert/mobilionmbi"
documentation = "https://docs.rs/mobilionmbi"
readme = "README.md"
keywords = ["mass-spectrometry", "proteomics", "ion-mobility", "mobilion", "hdf5"]
categories = ["science", "parser-implementations"]
rust-version = "1.84"

# docs.rs has no system libhdf5, so build the docs against the vendored static
# build instead — otherwise the crate simply fails to document.
[package.metadata.docs.rs]
features = ["static"]

[[bin]]
name = "mbidump"
path = "src/main.rs"

[lib]
name = "mobilionmbi"
path = "src/lib.rs"

[features]
# Build and statically link HDF5 instead of using a system libhdf5. Slower to
# compile, but the result has no external HDF5 dependency — which is what makes
# docs.rs build and lets a Python wheel ship without patchelf-ing a shared lib in.
# `zlib` is not optional here: .mbi datasets are gzip-compressed, so a static HDF5
# without it reads nothing.
static = ["hdf5-metno/static", "hdf5-metno/zlib"]

[dependencies]
hdf5-metno = "0.14.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"

[workspace]
members = ["mobilionmbi-connector"]
# Default to the core crate so `cargo test` / `cargo build` don't pull in the Python
# extension-module crate; build that explicitly via maturin.
default-members = ["."]
